
<input type="text" id="input" style="width: 100%; height: 3rem">

<script>
  function logEvt(e) {
    const { keyCode, key, shiftKey, metaKey } = e
    console.log(e.type, { keyCode, key, shiftKey, metaKey, e })
  }
  [
    window,
    // input
  ].forEach((node) => {
    node.addEventListener('keydown', logEvt)
    // node.addEventListener('keyup', logEvt)
    // node.addEventListener('keypress', logEvt)
  })
</script>
